product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - linuxX64
    - linuxArm64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - iosX64
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - mingwX64

aliases:
  - jvmAndAndroid: [ jvm, android ]

repositories:
  - id: diruptioPublic
    url: https://repo.diruptio.de/repository/maven-public-releases
    resolve: false
    publish: true
    credentials:
      file: local.properties
      usernameKey: diruptio_repo_username
      passwordKey: diruptio_repo_password

settings:
  publishing:
    enabled: true
    group: de.fabiexe
    version: 1.2.2
    publishSources: true