product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - linuxX64
    - linuxArm64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - mingwX64

dependencies:
  - //buffer
  - $ktor.io: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

repositories:
  - id: diruptioPublic
    url: https://repo.diruptio.de/repository/maven-public-releases
    resolve: false
    publish: true
    credentials:
      file: //local.properties
      usernameKey: diruptio_repo_username
      passwordKey: diruptio_repo_password

settings:
  ktor: enabled
  publishing:
    enabled: true
    group: de.fabiexe.buffer
    artifactId: buffer-ktor
    version: 1.3.0
    publishSources: true