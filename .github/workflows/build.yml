name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - name: Build
        run: |
          chmod +x ./kotlin
          ./kotlin build
      - name: Test
        run: ./kotlin test
